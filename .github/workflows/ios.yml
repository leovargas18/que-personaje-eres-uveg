name: Compilar y probar app iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prueba de la lógica (Swift puro)
        run: |
          swiftc QuePersonajeEres/Modelo.swift QuePersonajeEres/Cuestionario.swift Pruebas/main.swift -o prueba
          ./prueba

      - name: Compilar y ejecutar en simulador de iPhone
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID"
          xcodebuild -project QuePersonajeEres.xcodeproj -scheme QuePersonajeEres \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/QuePersonajeEres.app
          xcrun simctl launch "$UDID" mx.uveg.QuePersonajeEres
          sleep 8
          xcrun simctl io "$UDID" screenshot captura-pregunta1.png

      - name: Guardar captura como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-simulador
          path: captura-pregunta1.png
